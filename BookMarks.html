<title>Toolkit OSINT / Pentest</title>
<style>
:root {
  --fondo: #101216;
  --caja: #171a20;
  --borde: #2a2f3a;
  --texto: #d9dde5;
  --gris: #8b93a3;
  --azul: #7aa7d9;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font: 14px/1.5 system-ui, sans-serif;
}
header {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--fondo);
  border-bottom: 1px solid var(--borde);
  padding: 12px 20px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
h1 { font-size: 17px; margin: 0 8px 0 0; font-weight: 600; letter-spacing: .3px; }
input[type=search] {
  flex: 1;
  min-width: 220px;
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid var(--borde);
  background: var(--caja);
  color: var(--texto);
}
button {
  padding: 7px 12px;
  border-radius: 6px;
  border: 1px solid var(--borde);
  background: var(--caja);
  color: var(--texto);
  cursor: pointer;
}
button:hover { border-color: var(--azul); }
label, .cnt { color: var(--gris); font-size: 13px; }
main { max-width: 1100px; margin: 0 auto; padding: 16px 20px 60px; }
details.folder {
  background: var(--caja);
  border: 1px solid var(--borde);
  border-radius: 8px;
  margin: 10px 0;
  padding: 4px 14px;
}
details.folder > summary { font-weight: 600; font-size: 15px; padding: 10px 0; cursor: pointer; }
details.sub { margin: 4px 0 4px 14px; }
details.sub > summary { color: var(--azul); cursor: pointer; padding: 4px 0; }
ul { list-style: none; margin: 4px 0 10px 18px; padding: 0; columns: 2 280px; }
li { padding: 2px 0; break-inside: avoid; }
a { color: var(--texto); text-decoration: none; }
a:hover { color: var(--azul); text-decoration: underline; }
</style>
</head>

<header>
  <h1>Toolkit OSINT / Pentest</h1>
  <input type="search" id="q" placeholder="Buscar herramienta, URL o carpeta...">
  <label><input type="checkbox" id="nokey"> Ocultar las que requieren cuenta</label>
  <button id="btnOpen">Expandir</button>
  <button id="btnClose">Colapsar</button>

  <span class="cnt" id="cnt"></span>
</header>

const q = document.getElementById('q'), nokey = document.getElementById('nokey');
const root = document.getElementById('root'), cnt = document.getElementById('cnt');

function pintar() {
  const busca = q.value.trim().toLowerCase(), ocultar = nokey.checked;
  root.innerHTML = '';
  let total = 0;
  for (const [carpeta, subs] of Object.entries(datos)) {
    const det = document.createElement('details');
    det.className = 'folder';
    det.open = !!busca; // al buscar se abre todo
    const cont = document.createElement('div');
    let n = 0;
    for (const [sub, links] of Object.entries(subs)) {
      const items = links.filter(([t, u]) => {
        if (ocultar && t.includes('[cuenta]')) return false;
        return !busca || (t + ' ' + u + ' ' + sub + ' ' + carpeta).toLowerCase().includes(busca);
      });
      if (!items.length) continue;
      n += items.length;
      const ds = document.createElement('details');
      ds.className = 'sub';
      ds.open = !!busca;
      const s = document.createElement('summary');
      s.textContent = sub + ' (' + items.length + ')';
      ds.appendChild(s);
      const ul = document.createElement('ul');
      for (const [t, u] of items) {
        const li = document.createElement('li'), a = document.createElement('a');
        a.href = u; a.textContent = t; a.title = u;
        a.target = '_blank'; a.rel = 'noopener noreferrer';
        li.appendChild(a);
        ul.appendChild(li);
      }
      ds.appendChild(ul);
      cont.appendChild(ds);
    }
    if (!n) continue;
    total += n;
    const s = document.createElement('summary');
    s.textContent = carpeta + ' (' + n + ')';
    det.appendChild(s);
    det.appendChild(cont);
    root.appendChild(det);
  }
  cnt.textContent = total + ' enlaces';
}

function escapar(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// mismo formato que sale al exportar marcadores en firefox/chrome, asi se puede importar tal cual
function exportar() {
  const ts = Math.floor(Date.now() / 1000);
  let html = '<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>Bookmarks</TITLE>\n<H1>Bookmarks</H1>\n<DL><p>\n';
  html += '    <DT><H3 ADD_DATE="' + ts + '">Toolkit OSINT Pentest</H3>\n    <DL><p>\n';
  for (const [carpeta, subs] of Object.entries(datos)) {
    html += '        <DT><H3 ADD_DATE="' + ts + '">' + escapar(carpeta) + '</H3>\n        <DL><p>\n';
    for (const [sub, links] of Object.entries(subs)) {
      html += '            <DT><H3 ADD_DATE="' + ts + '">' + escapar(sub) + '</H3>\n            <DL><p>\n';
      for (const [t, u] of links) {
        html += '                <DT><A HREF="' + escapar(u) + '" ADD_DATE="' + ts + '">' + escapar(t) + '</A>\n';
      }
      html += '            </DL><p>\n';
    }
    html += '        </DL><p>\n';
  }
  html += '    </DL><p>\n</DL><p>\n';

  const blob = new Blob([html], {type: 'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'marcadores-osint-pentest.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000); // si lo libero al momento a veces no descarga
}

q.addEventListener('input', pintar);
nokey.addEventListener('change', pintar);
document.getElementById('btnOpen').onclick = () => document.querySelectorAll('details').forEach(d => d.open = true);
document.getElementById('btnClose').onclick = () => document.querySelectorAll('details').forEach(d => d.open = false);
document.getElementById('btnExport').onclick = exportar;
pintar();
